[project]
name = "llmtrain"
version = "0.1.0"
description = "Toy LLM training pipeline"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "tokenizers>=0.20",
    "datasets>=3.0",
    "wandb>=0.18",
]

[project.optional-dependencies]
cuda = ["liger-kernel>=0.8"]

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
 "ruff>=0.6",
 "mypy>=1.11",
 "torchinfo>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmtrain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
